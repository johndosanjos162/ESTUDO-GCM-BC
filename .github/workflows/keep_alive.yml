name: Manter Supabase Ativo

on:
  schedule:
    # Executa a cada 3 dias às 12:00 UTC (09:00 no horário de Brasília)
    - cron: '0 12 */3 * *'
  workflow_dispatch:  # Permite executar manualmente pelo botão

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta real ao banco (mantém ativo)
        run: |
          echo "🔍 Consultando Supabase para manter ativo..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/questoes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase está ativo!"
          else
            echo "⚠️ Resposta inesperada: $STATUS"
            exit 1
          fi
